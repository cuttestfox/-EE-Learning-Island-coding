const rooms=ROOMS.map((r,i)=>`<div class="room ${r[2]=="A"?"big":""} ${pick=="r"+i?"on":""}" onclick="eb(${y},'r${i}')"><b>${r[0]}</b><small>${r[3]}・${r[1]}</small></div>`).join("");
const labs=FIELDS.map((f,i)=>`<div class="room ${y<3?"lock":""} ${pick=="l"+i?"on":""}" onclick="eb(${y},'l${i}')"><b>${y<3?"🔒":"🔬"}</b>${f.n}組<br><small>實驗室</small></div>`).join("");
let info="";if(pick&&pick[0]=="r")info=`<div class="card">${roomInfo(y,+pick.slice(1))}</div>`;else if(pick&&pick[0]=="l")info=y<3?`<div class="card"><p>🌱 ${YN[y]}還沒有組別，要到大三才決定組別、進實驗室做實驗。</p></div>`:`<div class="card">${labInfo(+pick.slice(1))}</div>`;
$("detail").innerHTML=`<div class="card"><h3>電機一館／二館</h3><div>${yb}</div><h4>教室（5 間）</h4><div class="grid">${rooms}</div><h4>實驗室（6 間・大三、大四做實驗）${y<3?" 🔒":""}</h4><div class="grid">${labs}</div>${info}<p class="hint">206 在一館；其餘教室所在的館別與各教室的課程分配為示意，請提供實際對應，我再更新。複變函數是 6 門核心必選之一，不屬於基礎數學。</p></div>`}
// ---------- other tabs ----------
(function(){const r=[];[1,2,3,4].forEach(y=>["u","d"].forEach(s=>Y[y][s].forEach(c=>r.push([YN[y]+(s=="u"?"上":"下"),c[0],c[1],LN[c[2]]]))));
$("tbl").innerHTML="<tr><th>學期</th><th>科目</th><th>學分</th><th>地點</th></tr>"+r.map(x=>`<tr>${x.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")})();
$("credits").innerHTML=[["共同教育課程",28,"國文 4、英文 4、進階英文 2、人工智慧概論 2、海洋科學概論 2、博雅 14"],["系訂專業必修",69,"數理、電路、電子、電磁、訊號、實驗與專題"],["系訂專業必選修",9,"6 門核心至少選 3 門"],["必修總學分",112,"含必選修 15 學分（3 門核心 9 學分＋2 門對應領域指定課程 6 學分）"],["選修最低學分",24,"外系選修不超過 12 學分，電資學院以外系所不超過 6 學分；日文最多 4 學分可計入"],["畢業最低學分",136,"必修 112＋選修 24"]].map(c=>`<div class="card" style="margin:0"><h3>${c[0]}：${c[1]} 學分</h3><p style="margin:0;color:var(--mut)">${c[2]}</p></div>`).join("");
["b1","b2","b3"].forEach((b,i)=>$(b).onclick=()=>{["b1","b2","b3"].forEach((x,j)=>{$(x).classList.toggle("on",i==j);$("v"+(j+1)).classList.toggle("hide",i!=j)})});
$("detail").innerHTML=`<div class="card"><h3>六大領域</h3>${FIELDS.map(f=>`<span class="chip">${f.n}</span>`).join("")}<h3 style="margin-top:10px">整合學程</h3>${PROG.map(p=>`<span class="chip">${p}</span>`).join("")}</div>`;
</script></body></html>
